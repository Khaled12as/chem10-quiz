<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<title>مسابقة الكيمياء – الصف العاشر | BIO-CHEM TEACHER – Tamim Rajeh</title>
<style>
:root{--navy:#0B3D78;--blue:#1565C0;--teal:#14A39A;--red:#B3123F;--redbg:#FDEFF2;--sky:#CCE6F8;--pale:#F1F6FB;--green:#1E8E3E;--greenbg:#E8F6EC}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:Arial,"Arial Bold",Helvetica,sans-serif;font-weight:700;background:linear-gradient(180deg,#EAF4FC 0%,#fff 60%);color:#12263f;min-height:100vh;display:flex;flex-direction:column}
.l{direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:Arial,sans-serif;white-space:nowrap}
sub,sup{font-size:.68em;line-height:0}
header{background:var(--sky);border-bottom:4px solid var(--navy);padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.logo{width:54px;height:54px;flex:0 0 54px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(11,61,120,.25);display:grid;place-items:center;overflow:hidden}
.logo img,.logo svg{width:100%;height:100%;object-fit:contain}
.brand{flex:1;min-width:0}
.brand .en{direction:ltr;text-align:right;color:var(--navy);font-size:14px;letter-spacing:.3px}
.brand .ar{color:var(--blue);font-size:13px;margin-top:3px}
main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:14px 14px 24px}
.hero{background:var(--navy);color:#fff;border-radius:18px;padding:18px 16px;text-align:center;box-shadow:0 6px 16px rgba(11,61,120,.25)}
.hero h1{margin:0 0 6px;font-size:22px}
.hero p{margin:0;font-size:14px;opacity:.9}
.pills{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.pill{background:var(--teal);color:#fff;border-radius:30px;padding:5px 14px;font-size:13px}
.name{margin:14px 0 4px;display:flex;gap:8px;align-items:center;background:#fff;border:2px solid var(--sky);border-radius:14px;padding:8px 12px}
.name input{flex:1;border:0;outline:0;font:inherit;font-size:16px;color:var(--navy);background:transparent}
h2.unit{color:var(--navy);font-size:17px;margin:18px 4px 8px;display:flex;align-items:center;gap:8px}
h2.unit:before{content:"";width:8px;height:22px;background:var(--teal);border-radius:4px}
.sec{width:100%;display:flex;align-items:center;gap:10px;text-align:right;background:var(--pale);border:2px solid #DCE9F6;border-radius:14px;padding:13px 12px;margin:0 0 9px;font:inherit;font-size:15px;color:var(--navy);cursor:pointer}
.sec:active{transform:scale(.98)}
.sec .n{flex:0 0 auto;background:var(--blue);color:#fff;border-radius:20px;padding:3px 10px;font-size:12px}
.sec .tt{flex:1}
.sec.big{background:var(--navy);color:#fff;border-color:var(--navy)}
.sec.big .n{background:var(--teal)}
.sec.u{background:#fff;border-color:var(--blue)}
/* quiz */
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--navy);margin-bottom:8px;gap:8px}
.back{background:none;border:2px solid var(--navy);color:var(--navy);border-radius:20px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.bar{height:10px;background:#DCE9F6;border-radius:10px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--blue));width:0;transition:width .35s}
.card{background:#fff;border:2px solid #DCE9F6;border-radius:18px;padding:16px 14px;box-shadow:0 4px 14px rgba(11,61,120,.08)}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.badge{background:var(--navy);color:#fff;border-radius:12px;padding:5px 11px;font-size:14px}
.type{background:var(--teal);color:#fff;border-radius:20px;padding:4px 11px;font-size:12px}
.secname{font-size:12px;color:#5b7390;width:100%}
.q{font-size:18px;line-height:1.75;color:#0c2340;margin:4px 0 14px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:var(--pale);border:2px solid #CFE0F1;border-radius:14px;padding:14px 12px;font:inherit;font-size:16px;color:#0c2340;cursor:pointer;min-height:56px;line-height:1.6}
.opt .k{flex:0 0 30px;height:30px;border-radius:50%;background:#fff;border:2px solid var(--blue);color:var(--blue);display:grid;place-items:center;font-size:14px}
.opt .tx{flex:1}
.tfrow{grid-template-columns:1fr 1fr}
.tfrow .opt{justify-content:center;font-size:19px}
.opt.ok{background:var(--greenbg);border-color:var(--green)}
.opt.ok .k{background:var(--green);border-color:var(--green);color:#fff}
.opt.bad{background:var(--redbg);border-color:var(--red)}
.opt.bad .k{background:var(--red);border-color:var(--red);color:#fff}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.7;display:none}
.fb.show{display:block;animation:pop .25s ease}
.fb.good{background:var(--greenbg);border:2px solid var(--green);color:#11512a}
.fb.wrong{background:var(--redbg);border:2px solid var(--red);color:#7a0c2b}
.fb .h{font-size:17px;margin-bottom:4px}
.fb .ex{color:#24364d;margin-top:6px}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.next{margin-top:14px;width:100%;background:var(--blue);color:#fff;border:0;border-radius:14px;padding:15px;font:inherit;font-size:17px;cursor:pointer;display:none}
.next.show{display:block}
.score{display:flex;gap:8px}
.score span{background:#fff;border:2px solid #DCE9F6;border-radius:20px;padding:3px 10px}
.score .g{color:var(--green)} .score .r{color:var(--red)}
/* result */
.res{text-align:center}
.ring{width:170px;height:170px;margin:6px auto 12px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--teal) calc(var(--p)*1%),#DCE9F6 0)}
.ring div{width:136px;height:136px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--navy);font-size:34px}
.ring small{display:block;font-size:14px;color:#5b7390}
.res h3{color:var(--navy);margin:6px 0;font-size:20px}
.res .msg{color:var(--blue);font-size:16px;margin-bottom:12px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-size:16px;cursor:pointer;margin-top:10px}
.btn.p{background:var(--navy);color:#fff}
.btn.s{background:var(--teal);color:#fff}
.btn.o{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.rev{text-align:right;margin-top:16px}
.rev .it{background:var(--redbg);border:1px solid #f1c3cf;border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px;line-height:1.7}
.rev .it b{color:var(--green)}
footer{background:var(--navy);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;gap:8px;flex-wrap:wrap}
footer .tel{direction:ltr}
.hide{display:none}
</style>
</head>

['a',P,'العلم الذي يدرس تركيب المادة وخواصها والتغيرات التي تطرأ عليها، والطاقة المصاحبة لهذه التغيرات.',['علم الكيمياء','الكيمياء الفيزيائية','الكيمياء الحيوية','الكيمياء التحليلية'],0,'هذا هو تعريف علم الكيمياء الذي تتفرع منه بقية الفروع.'],

['l',M,'الذرة المستقبلة في كاتيون الهيدرونيوم {H_3O^+} هي:',['ذرة الأكسجين','كاتيون الهيدروجين {H^+}','جزيء الماء','ذرة النيتروجين'],1,'H⁺ ليس به إلكترونات فيستقبل زوج الإلكترونات من الأكسجين.'],
['l',M,'أدق تفسير لتكوّن الرابطة التناسقية:',['كل ذرة تساهم بإلكترون واحد','ذرة واحدة تساهم بزوج من الإلكترونات مع كاتيون الهيدروجين','انتقال إلكترونات بالكامل من ذرة لأخرى','عدم وجود إلكترونات في الرابطة'],1,'في الرابطة التناسقية زوج الإلكترونات يأتي من ذرة واحدة فقط (المانحة).'],
['l',M,'مركب يحتوي على رابطتين تساهميتين أحاديتين ورابطة تناسقية واحدة:',['{NH_4^+}','{H_3O^+}','{NH_3}','{CO}'],1,'H₃O⁺: رابطتان O–H من الماء + رابطة تناسقية مع H⁺'],
['l',M,'مركب يحتوي على ثلاث روابط تساهمية أحادية ورابطة تناسقية واحدة:',['{NH_4^+}','{H_3O^+}','{NH_3}','{CO}'],0,'NH₄⁺: ثلاث روابط N–H + رابطة تناسقية مع H⁺'],
['l',M,'مركب يحتوي على ثلاث روابط تساهمية أحادية فقط:',['{NH_4^+}','{H_3O^+}','{NH_3}','{CO}'],2,'NH₃: ثلاث روابط N–H ولا توجد رابطة تناسقية.']
];

const TYPE_NAME={mcq:'اختر من متعدد',tf:'صح أم خطأ',term:'المصطلح العلمي'};
const LETTERS=['أ','ب','ج','د'];
function fmt(s){
  return String(s).replace(/\{([^}]*)\}/g,(m,x)=>{
    x=x.replace(/\^([0-9]+[+\-]?|[+\-])/g,'<sup>$1</sup>')
       .replace(/_(\([a-z]+\)|[0-9]+|[a-zℓ])/g,'<sub>$1</sub>');
    return '<span class="l">'+x+'</span>';
  });
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const Q=QUESTIONS.map((r,i)=>({id:i,s:r[0],t:r[1],q:r[2],o:r[3],a:r[4],e:r[5]}));
const secTitle=id=>SECTIONS.find(s=>s.id===id).t;
let list=[],idx=0,score=0,wrongs=[],lastFilter=null,lastLabel='';

function buildMenu(){
  document.getElementById('totalPill').textContent=Q.length+' سؤالًا';
  const m=document.getElementById('menu');let h='';
  const cnt=f=>Q.filter(f).length;
  h+=`<button class="sec big" onclick="start('all')"><span class="tt">🏆 الاختبار الشامل (الكتاب كاملًا – أسئلة عشوائية)</span><span class="n">${Q.length}</span></button>`;
  [[1,'الوحدة الأولى: الإلكترونات في الذرات ودورية العناصر'],[2,'الوحدة الثانية: الروابط الكيميائية (الأيونية، التساهمية، التناسقية)']].forEach(([u,t])=>{
    h+=`<h2 class="unit">${t}</h2>`;
    h+=`<button class="sec u" onclick="start('u${u}')"><span class="tt">📘 تقويم الوحدة ${u===1?'الأولى':'الثانية'} كاملة</span><span class="n">${cnt(q=>SECTIONS.find(s=>s.id===q.s).u===u)}</span></button>`;
    SECTIONS.filter(s=>s.u===u).forEach(s=>{
      h+=`<button class="sec" onclick="start('${s.id}')"><span class="tt">${s.t}</span><span class="n">${cnt(q=>q.s===s.id)} س</span></button>`;
    });
  });
  m.innerHTML=h;
}
function show(id){['home','quiz','result'].forEach(x=>document.getElementById(x).classList.toggle('hide',x!==id));window.scrollTo(0,0)}
function start(key){
  lastFilter=key;
  if(key==='all'){list=shuffle(Q);lastLabel='الاختبار الشامل'}
  else if(key[0]==='u'){const u=+key[1];list=Q.filter(q=>SECTIONS.find(s=>s.id===q.s).u===u);lastLabel='الوحدة '+(u===1?'الأولى':'الثانية')}
  else{list=Q.filter(q=>q.s===key);lastLabel=secTitle(key)}
  begin();
}
function begin(){
  list=list.map(q=>{ // ترتيب عشوائي للبدائل في كل محاولة
    if(q.t==='tf')return Object.assign({},q,{opts:['صح ✔','خطأ ✘'],ans:q.a});
    const order=shuffle(q.o.map((_,i)=>i));
    return Object.assign({},q,{opts:order.map(i=>q.o[i]),ans:order.indexOf(q.a)});
  });
  idx=0;score=0;wrongs=[];show('quiz');render();
}
function render(){
  const q=list[idx];
  document.getElementById('qnum').textContent=`السؤال ${idx+1} من ${list.length}`;
  document.getElementById('qtype').textContent=TYPE_NAME[q.t];
  document.getElementById('qsec').textContent=secTitle(q.s);
  const lead=q.t==='term'?'<div style="color:#1565C0;font-size:14px;margin-bottom:4px">ما المصطلح العلمي الذي تدل عليه العبارة؟</div>':
            q.t==='tf'?'<div style="color:#1565C0;font-size:14px;margin-bottom:4px">حدّد صحة العبارة:</div>':'';
  document.getElementById('qtext').innerHTML=lead+fmt(q.q);
  const o=document.getElementById('opts');
  o.className='opts'+(q.t==='tf'?' tfrow':'');
  o.innerHTML=q.opts.map((t,i)=>`<button class="opt" onclick="pick(${i})">${q.t==='tf'?'':`<span class="k">${LETTERS[i]}</span>`}<span class="tx">${fmt(t)}</span></button>`).join('');
  const fb=document.getElementById('fb');fb.className='fb';fb.innerHTML='';
  document.getElementById('next').className='next';
  document.getElementById('bar').style.width=(idx/list.length*100)+'%';
  document.getElementById('sc').textContent=score;
  document.getElementById('wr').textContent=wrongs.length;
}
const PRAISE=['أحسنت! إجابة صحيحة 👏','ممتاز! استمر 🌟','رائع! إجابة دقيقة ✅','عمل متميز 👍','برافو! 🎉'];
function pick(i){
  const q=list[idx],btns=[...document.querySelectorAll('.opt')];
  btns.forEach(b=>b.disabled=true);
  btns[q.ans].classList.add('ok');
  const fb=document.getElementById('fb');
  if(i===q.ans){score++;fb.className='fb good show';fb.innerHTML=`<div class="h">${PRAISE[Math.floor(Math.random()*PRAISE.length)]}</div><div class="ex">💡 ${fmt(q.e)}</div>`;}
  else{btns[i].classList.add('bad');wrongs.push(q);
    fb.className='fb wrong show';fb.innerHTML=`<div class="h">إجابة خاطئة ✘</div>الإجابة الصحيحة: <b>${fmt(q.opts[q.ans])}</b><div class="ex">💡 ${fmt(q.e)}</div>`;}
  document.getElementById('sc').textContent=score;document.getElementById('wr').textContent=wrongs.length;
  const n=document.getElementById('next');n.textContent=idx===list.length-1?'عرض النتيجة 🏁':'السؤال التالي ←';n.className='next show';
  setTimeout(()=>n.scrollIntoView({behavior:'smooth',block:'nearest'}),120);
}
function nextQ(){if(idx<list.length-1){idx++;render();window.scrollTo({top:0,behavior:'smooth'})}else finish()}
function finish(){
  document.getElementById('bar').style.width='100%';
  const pct=Math.round(score/list.length*100),nm=document.getElementById('stName').value.trim();
  document.getElementById('rTitle').textContent=(nm?nm+' – ':'')+lastLabel;
  document.getElementById('ring').style.setProperty('--p',pct);
  document.getElementById('rPct').textContent=pct+'%';
  document.getElementById('rScore').textContent=`${score} من ${list.length}`;
  document.getElementById('rMsg').textContent=pct>=90?'ممتاز جدًّا! مستواك رائع 🌟':pct>=75?'جيد جدًّا! راجع الأخطاء القليلة 👍':pct>=50?'جيد، تحتاج إلى مزيد من المراجعة 📖':'لا بأس، راجع الدرس وحاول مرة أخرى 💪';
  document.getElementById('retryWrong').classList.toggle('hide',!wrongs.length);
  document.getElementById('rev').innerHTML=wrongs.length?'<h3 style="font-size:16px">مراجعة الأسئلة الخاطئة:</h3>'+wrongs.map((q,k)=>`<div class="it">${k+1}) ${fmt(q.q)}<br>الإجابة الصحيحة: <b>${fmt(q.opts[q.ans])}</b></div>`).join(''):'';
  show('result');
}
function retry(){start(lastFilter)}
function retryWrong(){list=wrongs.map(q=>Q[q.id]);lastLabel='إعادة الأسئلة الخاطئة';begin()}
function goHome(){show('home')}
buildMenu();
</script>
</body>
